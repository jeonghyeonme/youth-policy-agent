# 푸시·PR마다 도는 검사. 공공 API·Groq를 호출하지 않고 키도 쓰지 않는다(AGENTS.md "트래픽", "API 키").
name: CI

on:
  pull_request:
  push:
    branches: [archive/youth-policy]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 측정·수집 스크립트 테스트
        run: python -m unittest discover -s experiments/context-measurement -p "test_*.py"
      - name: 문서 상대 링크 확인
        run: python .github/scripts/check_links.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      # 테스트가 experiments/의 저장 샘플을 읽으므로 저장소 전체를 체크아웃한다
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트 (저장 샘플, API 호출 없음)
        run: npm test
      - name: 빌드
        run: npm run build
